name: Build UML Linux kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version to build (e.g. 6.12.1). Leave empty for latest stable."
        required: false
        default: ""
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-uml.yml'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves wget xz-utils ca-certificates jq

      - name: Resolve kernel version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.kernel_version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(curl -fsSL https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to determine kernel version" >&2
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          BASE_URL="https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x"
          TARBALL="linux-${VERSION}.tar.xz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=${BASE_URL}/${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Building Linux $VERSION from ${BASE_URL}/${TARBALL}"

      - name: Download and extract kernel source
        run: |
          set -euo pipefail
          wget -q "${{ steps.version.outputs.url }}"
          tar -xf "${{ steps.version.outputs.tarball }}"

      - name: Configure UML kernel
        working-directory: linux-${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make ARCH=um defconfig
          # Ensure useful options for UML
          ./scripts/config --enable CONFIG_HOSTFS || true
          ./scripts/config --enable CONFIG_MAGIC_SYSRQ || true
          make ARCH=um olddefconfig

      - name: Build UML kernel
        working-directory: linux-${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make ARCH=um -j"$(nproc)"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p out
          if [ -f "linux-${VERSION}/linux" ]; then
            cp "linux-${VERSION}/linux" "out/linux-${VERSION}-um"
            chmod +x "out/linux-${VERSION}-um"
          fi
          if [ -f "linux-${VERSION}/vmlinux" ]; then
            cp "linux-${VERSION}/vmlinux" "out/vmlinux-${VERSION}-um"
          fi
          cp "linux-${VERSION}/.config" "out/config-${VERSION}-um"
          echo "$VERSION" > "out/kernel-version.txt"
          ls -lh out

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: uml-linux-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 30
