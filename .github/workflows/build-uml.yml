name: Build and run UML Linux with Ubuntu rootfs

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version to build (e.g. 6.12.1). Leave empty for latest stable."
        required: false
        default: ""
      ubuntu_suite:
        description: "Ubuntu suite for rootfs image (e.g. noble, jammy)"
        required: false
        default: "noble"
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-uml.yml'
      - 'scripts/**'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves wget xz-utils ca-certificates jq \
            debootstrap e2fsprogs util-linux iproute2 iptables iputils-ping curl

      - name: Resolve kernel version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.kernel_version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(curl -fsSL https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to determine kernel version" >&2
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          BASE_URL="https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x"
          TARBALL="linux-${VERSION}.tar.xz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=${BASE_URL}/${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Building Linux $VERSION"

      - name: Download and extract kernel source
        run: |
          set -euo pipefail
          wget -q "${{ steps.version.outputs.url }}"
          tar -xf "${{ steps.version.outputs.tarball }}"

      - name: Configure UML kernel
        working-directory: linux-${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make ARCH=um defconfig
          # Useful/required options for running from a block device image
          ./scripts/config --enable CONFIG_BLK_DEV_UBD || true
          ./scripts/config --enable CONFIG_EXT4_FS || true
          ./scripts/config --enable CONFIG_HOSTFS || true
          ./scripts/config --enable CONFIG_MAGIC_SYSRQ || true
          # Networking (try common transports for UML)
          ./scripts/config --enable CONFIG_UML_NET || true
          ./scripts/config --enable CONFIG_UML_NET_VECTOR || true
          ./scripts/config --enable CONFIG_UML_NET_TUNTAP || true
          ./scripts/config --enable CONFIG_UML_NET_SLIRP || true
          ./scripts/config --enable CONFIG_UML_NET_DETERMINISTIC_MAC || true
          ./scripts/config --enable CONFIG_INET || true
          ./scripts/config --enable CONFIG_PACKET || true
          ./scripts/config --enable CONFIG_UNIX || true
          ./scripts/config --enable CONFIG_NETDEVICES || true
          make ARCH=um olddefconfig

      - name: Build UML kernel
        working-directory: linux-${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make ARCH=um -j"$(nproc)"

      - name: Create Ubuntu rootfs image
        id: rootfs
        env:
          SUITE: ${{ github.event.inputs.ubuntu_suite || 'noble' }}
        run: |
          set -euo pipefail
          IMG="ubuntu-${SUITE}-uml.img"
          MNT="$(mktemp -d)"
          echo "Creating $IMG (1G sparse ext4) with Ubuntu $SUITE..."
          truncate -s 1G "$IMG"
          mkfs.ext4 -F "$IMG"
          sudo mount -o loop "$IMG" "$MNT"
          cleanup() { sudo umount "$MNT" 2>/dev/null || true; rmdir "$MNT" 2>/dev/null || true; }
          trap cleanup EXIT
          sudo debootstrap --variant=minbase "$SUITE" "$MNT" http://archive.ubuntu.com/ubuntu
          # Basic config
          echo "ubuntu-uml" | sudo tee "$MNT/etc/hostname" >/dev/null
          sudo tee "$MNT/etc/fstab" >/dev/null <<'FSTAB'
          /dev/ubda / ext4 defaults 0 1
          proc /proc proc defaults 0 0
          sysfs /sys sysfs defaults 0 0
          FSTAB
          sudo mkdir -p "$MNT/proc" "$MNT/sys" "$MNT/dev"
          # Install basic networking tools inside the guest
          sudo cp /etc/resolv.conf "$MNT/etc/resolv.conf" || true
          sudo mount --bind /dev "$MNT/dev"
          sudo mount --bind /dev/pts "$MNT/dev/pts"
          sudo mount -t proc proc "$MNT/proc"
          sudo mount -t sysfs sys "$MNT/sys"
          sudo chroot "$MNT" /bin/sh -c 'apt-get update && apt-get install -y --no-install-recommends iproute2 iputils-ping ca-certificates wget curl && rm -rf /var/lib/apt/lists/*'
          sudo umount "$MNT/sys" "$MNT/proc" "$MNT/dev/pts" "$MNT/dev"
          echo 'nameserver 8.8.8.8' | sudo tee "$MNT/etc/resolv.conf" >/dev/null
          # Init script executed by UML (avoids relying on stdin/tty behavior)
          sudo tee "$MNT/init.uml" >/dev/null <<'SCRIPT'
          #!/bin/sh
          set -e
          mount -t proc proc /proc 2>/dev/null || true
          mount -t sysfs sysfs /sys 2>/dev/null || true
          mount -t devtmpfs devtmpfs /dev 2>/dev/null || true
          echo '--- UML_BOOT_BEGIN ---'
          echo "KERNEL=$(uname -r)"
          echo "ARCH=$(uname -m)"
          echo "MEM_KB=$(awk '/MemTotal/{print $2}' /proc/meminfo 2>/dev/null || echo unknown)"
          if [ -f /etc/os-release ]; then
            echo '--- OS_RELEASE ---'
            cat /etc/os-release
          fi

          # Networking setup (TAP on host expected at 192.168.254.1/24)
          IFACE=""
          for c in eth0 vec0 eth1; do
            if ip link show "$c" >/dev/null 2>&1; then IFACE="$c"; break; fi
          done
          echo "NET_IFACE=${IFACE:-none}"
          if [ -n "$IFACE" ]; then
            ip link set "$IFACE" up || true
            ip addr add 192.168.254.2/24 dev "$IFACE" 2>/dev/null || true
            ip route add default via 192.168.254.1 2>/dev/null || true
            echo 'nameserver 8.8.8.8' > /etc/resolv.conf || true
            sleep 1
            echo '--- NET_TEST ---'
            ip -o addr show dev "$IFACE" || true
            ip route || true
            ping -c 1 -W 3 192.168.254.1 >/dev/null 2>&1 && echo "PING_GW_OK" || echo "PING_GW_FAIL"
            ping -c 1 -W 5 8.8.8.8 >/dev/null 2>&1 && echo "PING_INET_OK" || echo "PING_INET_FAIL"
            if wget -q --timeout=10 -O /dev/null https://example.com 2>/dev/null || curl -fsS --max-time 10 -o /dev/null https://example.com 2>/dev/null; then
              echo "NET_FETCH_OK"
            else
              echo "NET_FETCH_FAIL"
            fi
          else
            echo "NET_NO_IFACE"
            ip link || true
          fi

          echo "--- CURL_GOOGLE_TEST ---"
          curl google.com || true
          echo "--- CURL_GOOGLE_TEST_DONE ---"

          echo '--- MARKER: UBUNTU_ROOTFS_OK ---'
          sync
          poweroff -f 2>/dev/null || halt -f 2>/dev/null || echo o > /proc/sysrq-trigger 2>/dev/null || true
          sleep 5
          SCRIPT
          sudo chmod +x "$MNT/init.uml"
          sync
          sudo umount "$MNT"
          trap - EXIT
          rmdir "$MNT"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          ls -lh "$IMG"

      - name: Run Ubuntu rootfs in UML
        env:
          KVER: ${{ steps.version.outputs.version }}
          IMG: ${{ steps.rootfs.outputs.img }}
        run: |
          set -euo pipefail
          KERNEL="linux-${KVER}/linux"
          chmod +x "$KERNEL"
          LOG="uml-boot.log"

          # Host networking for UML guest (TAP + NAT)
          sudo ip tuntap add tap0 mode tap user "$(id -un)" || sudo ip tuntap add tap0 mode tap || true
          sudo ip addr add 192.168.254.1/24 dev tap0 || true
          sudo ip link set tap0 up
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 192.168.254.0/24 -o "$(ip route show default | awk '/default/ {print $5; exit}')" -j MASQUERADE || true
          sudo iptables -A FORWARD -i tap0 -j ACCEPT || true
          sudo iptables -A FORWARD -o tap0 -m state --state RELATED,ESTABLISHED -j ACCEPT || true

          set +e
          timeout --signal=KILL 300 "$KERNEL" \
            ubda="$IMG" \
            root=/dev/ubda \
            rw \
            mem=3072M \
            init=/init.uml \
            eth0=tuntap,tap0 \
            vec0:transport=tap,ifname=tap0 \
            con0=null,fd:1 con=null \
            > "$LOG" 2>&1
          RC=$?
          set -e
          echo "UML exit code: $RC"
          echo "---- boot log tail ----"
          tail -n 160 "$LOG" || true
          echo "-----------------------"
          grep -q 'UBUNTU_ROOTFS_OK' "$LOG" || { echo "ERROR: Ubuntu rootfs did not boot/run as expected"; exit 1; }
          grep -q 'ID=ubuntu' "$LOG" || echo "WARNING: /etc/os-release did not show ID=ubuntu (check log)"
          if grep -q 'NET_FETCH_OK' "$LOG"; then
            echo "Networking test: OK"
          else
            echo "WARNING: Networking fetch test did not succeed; see log for details"
          fi
          if grep -q 'PING_INET_OK' "$LOG"; then
            echo "Internet ping: OK"
          fi

      - name: Collect artifacts
        if: always()
        env:
          KVER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -f "linux-${KVER}/linux" ]; then
            cp "linux-${KVER}/linux" "out/linux-${KVER}-um"
            chmod +x "out/linux-${KVER}-um"
          fi
          cp "linux-${KVER}/.config" "out/config-${KVER}-um" 2>/dev/null || true
          echo "$KVER" > "out/kernel-version.txt"
          cp uml-boot.log out/ 2>/dev/null || true
          # Compress rootfs image if present (can be large)
          if [ -f "${{ steps.rootfs.outputs.img || '' }}" ]; then
            gzip -c "${{ steps.rootfs.outputs.img }}" > "out/${{ steps.rootfs.outputs.img }}.gz" || true
          fi
          ls -lh out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uml-ubuntu-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
